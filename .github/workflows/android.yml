name: Build Health2 signed APK
on:
  workflow_dispatch:
  push:
    branches: [native-android-port]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile debug variant (validation only)
        run: gradle :app:assembleDebug --no-daemon
      - name: Restore persistent Health2 signing key
        env:
          HEALTH2_KEYSTORE_BASE64: ${{ secrets.HEALTH2_KEYSTORE_BASE64 }}
          HEALTH2_KEYSTORE_PASSWORD: ${{ secrets.HEALTH2_KEYSTORE_PASSWORD }}
          HEALTH2_KEY_ALIAS: ${{ secrets.HEALTH2_KEY_ALIAS }}
          HEALTH2_KEY_PASSWORD: ${{ secrets.HEALTH2_KEY_PASSWORD }}
        run: |
          if [ -z "$HEALTH2_KEYSTORE_BASE64" ] || [ -z "$HEALTH2_KEYSTORE_PASSWORD" ] || [ -z "$HEALTH2_KEY_ALIAS" ] || [ -z "$HEALTH2_KEY_PASSWORD" ]; then
            echo "::error::One or more HEALTH2 signing secrets are missing. See SIGNING.md."
            exit 1
          fi
          echo "$HEALTH2_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/health2-release.jks"
          echo "HEALTH2_KEYSTORE_PATH=$RUNNER_TEMP/health2-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon
        env:
          HEALTH2_KEYSTORE_PASSWORD: ${{ secrets.HEALTH2_KEYSTORE_PASSWORD }}
          HEALTH2_KEY_ALIAS: ${{ secrets.HEALTH2_KEY_ALIAS }}
          HEALTH2_KEY_PASSWORD: ${{ secrets.HEALTH2_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: Health2-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
